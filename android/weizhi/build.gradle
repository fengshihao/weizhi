plugins {
    id("com.android.library")
}

android {
    namespace = "com.weizhi"
    compileSdk = 34

    defaultConfig {
        minSdk = 26
        consumerProguardFiles("consumer-rules.pro")
        ndk {
            abiFilters += ["arm64-v8a"]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        getByName("main") {
            java.srcDir("../../java")
            jniLibs.srcDir("src/main/jniLibs")
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

tasks.register("copyNativeLib", Copy) {
    description = "Copy arm64 libweizhijni.so built by scripts/build-android.sh"
    from("../../build-android/arm64-v8a/libweizhijni.so")
    into("src/main/jniLibs/arm64-v8a")
    onlyIf { file("../../build-android/arm64-v8a/libweizhijni.so").exists() }
}

tasks.named("preBuild").configure { dependsOn("copyNativeLib") }
