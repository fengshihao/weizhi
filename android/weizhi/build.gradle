plugins {
    id("com.android.library")
    id("maven-publish")
}

apply from: rootProject.file("weizhi-maven-publish.gradle")

android {
    namespace = "com.weizhi"
    compileSdk = 34

    defaultConfig {
        minSdk = 26
        consumerProguardFiles("consumer-rules.pro")
        ndk {
            abiFilters += ["arm64-v8a"]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        getByName("main") {
            java.srcDir("../../java")
            jniLibs.srcDir("src/main/jniLibs")
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

}

tasks.register("copyNativeLib", Copy) {
    description = "Copy stripped arm64 libweizhijni.so from scripts/build-android.sh (fallback: unstripped)"
    def stripped = file("../../build-android/arm64-v8a/stripped/libweizhijni.so")
    def raw = file("../../build-android/arm64-v8a/libweizhijni.so")
    from(stripped.exists() ? stripped : raw)
    into("src/main/jniLibs/arm64-v8a")
    onlyIf { stripped.exists() || raw.exists() }
}

tasks.named("preBuild").configure { dependsOn("copyNativeLib") }
