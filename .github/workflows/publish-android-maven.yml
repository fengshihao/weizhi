name: Publish Android Maven

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Android ABI (libweizhijni.so)
        required: false
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      publish_github_packages:
        description: Also publish to GitHub Packages (this repo)
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "android-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK + NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            SDKM="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
            echo "${ANDROID_HOME}/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKM" --licenses >/dev/null
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Build native + publish to android/build/maven
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
          ABI: ${{ github.event.inputs.abi || 'arm64-v8a' }}
        run: |
          chmod +x scripts/publish-android-maven.sh android/gradlew
          ./scripts/publish-android-maven.sh "${ABI}"

      - name: Package tarball for Agent1 import
        run: |
          chmod +x scripts/package-android-maven-bundle.sh
          ./scripts/package-android-maven-bundle.sh dist/weizhi-android-maven.tgz

      - name: Upload Maven bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: weizhi-android-maven
          path: dist/weizhi-android-maven.tgz
          retention-days: 90

      - name: Publish to GitHub Packages
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_github_packages == true)
        env:
          WEIZHI_PUBLISH_URL: https://maven.pkg.github.com/${{ github.repository }}
          WEIZHI_PUBLISH_USERNAME: ${{ github.actor }}
          WEIZHI_PUBLISH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
          ABI: ${{ github.event.inputs.abi || 'arm64-v8a' }}
        run: ./scripts/publish-android-maven.sh "${ABI}" --remote
