name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run desktop gate (skip ASan in CI)
        run: WEIZHI_SKIP_ASAN=1 ./scripts/test.sh

  android-maven:
    name: Publish Android Maven (Agent1)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Manual run from Actions tab, or after CI on master (desktop job is the fast gate).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Build native + publish Maven repo
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: |
          chmod +x scripts/publish-android-maven.sh android/gradlew
          ./scripts/publish-android-maven.sh arm64-v8a

      - name: Package tarball for Agent1
        run: |
          chmod +x scripts/package-android-maven-bundle.sh
          ./scripts/package-android-maven-bundle.sh dist/weizhi-android-maven.tgz

      - name: Upload Maven bundle
        uses: actions/upload-artifact@v4
        with:
          name: weizhi-android-maven
          path: dist/weizhi-android-maven.tgz
          retention-days: 30
